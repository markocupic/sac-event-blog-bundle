services:
    _defaults:
        autowire: true
        autoconfigure: true

    Markocupic\SacEventBlogBundle\:
        resource: ../src/
        exclude: ../src/{DependencyInjection,Model,Resources}

    Markocupic\SacEventBlogBundle\DataContainer\CalendarEventsBlog:
        arguments:
            - '@Markocupic\SacEventToolBundle\Download\BinaryFileDownload'
            - '@Markocupic\SacEventToolBundle\Util\CalendarEventsUtil'
            - '@database_connection'
            - '@request_stack'
            - '@router'
            - '@security.helper'
            - '%kernel.project_dir%'
            - '%sacevt.temp_dir%'
            - '%sac_event_blog.docx_export_template%'
            - '%sacevt.locale%'

    # Event blog list content element
    Markocupic\SacEventBlogBundle\Controller\ContentElement\EventBlogListController:
        arguments:
            - '@contao.framework'
            - '@contao.routing.scope_matcher'
            - '%kernel.project_dir%'
        public: true

    # Event blog reader content element
    Markocupic\SacEventBlogBundle\Controller\ContentElement\EventBlogReaderController:
        arguments:
            - '@Markocupic\SacEventToolBundle\Util\CalendarEventsUtil'
            - '@contao.framework'
            - '@contao.routing.scope_matcher'
            - '@Codefog\HasteBundle\UrlParser'
            - '@contao.filesystem.virtual.files'
            - '%kernel.project_dir%'
            - '%sacevt.locale%'
        public: true

    # Member dashboard content element: list event reports and the form to generate new event reports
    Markocupic\SacEventBlogBundle\Controller\ContentElement\MemberDashboardEventBlogListController:
        arguments:
            - '@Markocupic\SacEventToolBundle\Util\CalendarEventsUtil'
            - '@contao.framework'
            - '@contao.routing.scope_matcher'
            - '@security.helper'
            - '@translator'
            - '@Codefog\HasteBundle\UrlParser'
        public: true

    # Member dashboard content element: display the forms for writing new event reports
    Markocupic\SacEventBlogBundle\Controller\ContentElement\MemberDashboardEventBlogWriteController:
        arguments:
            - '@Markocupic\SacEventToolBundle\Util\CalendarEventsUtil'
            - '@database_connection'
            - '@contao.csrf.token_manager'
            - '@contao.framework'
            - '@Markocupic\SacEventBlogBundle\Upload\ImageUploadHandler'
            - '@Markocupic\SacEventBlogBundle\Validator\ImageUploadValidator'
            - '@request_stack'
            - '@contao.routing.scope_matcher'
            - '@security.helper'
            - '@translator'
            - '@Codefog\HasteBundle\UrlParser'
            - '%sac_event_blog.asset_dir%'
            - '%sacevt.locale%'
            - '%kernel.project_dir%'
            - '%markocupic_contao_filepond_uploader.tmp_path%'
        public: true

    # Renders the event blog list/reader content elements for the Vue.js frontend app
    Markocupic\SacEventBlogBundle\Controller\Api\EventBlogContentElementController:
        arguments:
            - '@contao.framework'
        public: true

    Markocupic\SacEventBlogBundle\Controller\Api\MemberDashboardWriteEventBlogController:
        arguments:
            - '@database_connection'
            - '@contao.framework'
            - '@request_stack'
            - '@Markocupic\SacEventToolBundle\Image\RotateImage'
            - '@router'
            - '@security.helper'
            - '@translator'
            - '@Codefog\HasteBundle\UrlParser'
            - '@Terminal42\NotificationCenterBundle\NotificationCenter'
            - '%kernel.project_dir%'
            - '%sacevt.locale%'
        public: true

    # Contao Backend Module "Maintenance": Delete no more used event blog media directories
    Markocupic\SacEventBlogBundle\ContaoBackendMaintenance\MaintainModuleEventBlog:
        public: true
        arguments:
            - '@database_connection'
            - '%kernel.project_dir%'
            - '%sac_event_blog.asset_dir%'
            - '@monolog.logger.contao'
